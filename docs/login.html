<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('ws-theme-pref')||'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Weiss Schwarz</title>
<link rel="stylesheet" href="assets/wsdata.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-box{
    width:min(320px, 90vw);padding:32px 28px;background:var(--card-bg);
    border:1px solid var(--line);
  }
  .login-box h1{margin:0 0 4px;font-size:22px;font-weight:700;}
  .login-box h1 span{color:var(--red);}
  .login-box p{margin:0 0 24px;color:var(--ink-soft);font-size:13px;}
  .login-field{margin-bottom:16px;}
  .login-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:6px;}
  .login-field input{
    width:100%;font-family:var(--sans);font-size:15px;padding:10px 12px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);box-sizing:border-box;
  }
  .login-submit{
    width:100%;padding:11px;background:var(--red);color:#fff;border:none;font-size:14px;
    font-weight:600;cursor:pointer;margin-top:4px;
  }
  .login-submit:hover{background:var(--red-deep);}
  .login-submit:disabled{opacity:0.5;cursor:default;}
  .login-error{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px;}
  .login-note{color:var(--ink-soft);font-size:11.5px;margin-top:18px;line-height:1.5;}
</style>
</head>
<body>

<div class="login-box">
  <h1>Weiss<span>Schwarz</span></h1>
  <p>Log in — or pick a username and PIN to get started.</p>

  <form id="login-form">
    <div class="login-field">
      <label for="username-input">Username</label>
      <input type="text" id="username-input" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="pin-input">6-digit PIN</label>
      <input type="password" id="pin-input" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-submit" id="login-submit-btn">Log in</button>
    <div class="login-error" id="login-error"></div>
  </form>

  <p class="login-note" id="first-time-note">New username? It's created the moment you log in — whatever PIN you enter becomes yours from now on. No separate sign-up step.</p>
</div>

<script src="assets/api.js"></script>
<script>
  const W = window.WSAPI;

  // Already logged in? Skip the form entirely.
  if (W.isLoggedIn()) {
    window.location.href = "browse.html";
  }

  const form = document.getElementById('login-form');
  const usernameInput = document.getElementById('username-input');
  const pinInput = document.getElementById('pin-input');
  const submitBtn = document.getElementById('login-submit-btn');
  const errorEl = document.getElementById('login-error');

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errorEl.textContent = '';
    const username = usernameInput.value.trim();
    const pin = pinInput.value.trim();
    if (!/^\d{6}$/.test(pin)) {
      errorEl.textContent = 'PIN must be exactly 6 digits.';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';
    try {
      const result = await W.login(username, pin);
      window.location.href = "browse.html";
    } catch (e) {
      errorEl.textContent = e.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
